services:
  backend:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest

    restart: always
    networks:
      - frappe_network
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}


  configurator:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: "no"
    networks:
      - frappe_network
    entrypoint: ["bash", "-c"]
    command: >
      ls -1 apps > sites/apps.txt;
      bench set-config -g db_host $$DB_HOST;
      bench set-config -gp db_port $$DB_PORT;
      bench set-config -g redis_socketio "redis://$$REDIS_CACHE";
      bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}
      SOCKETIO_PORT: ${SOCKETIO_PORT}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  migration:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    networks:
      - frappe_network
    entrypoint: ["bash", "-c"]
    command: >
      echo "Waiting for database...";
      until mysqladmin ping -h "$$DB_HOST" -P "$$DB_PORT" -u root -p"$$MYSQL_ROOT_PASSWORD" --silent; do
        sleep 3;
      done;

      echo "Enabling maintenance mode...";
      bench --site all set-config -p maintenance_mode 1 || true;
      bench --site all set-config -p pause_scheduler 1 || true;

      echo "Running migrations...";
      bench --site all migrate;

      echo "Disabling maintenance mode...";
      bench --site all set-config -p maintenance_mode 0 || true;
      bench --site all set-config -p pause_scheduler 0 || true;

      echo "Migration completed.";
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs


  db:
    image: mariadb:10.8
    restart: always
    networks:
      - frappe_network
    healthcheck:
      test: mysqladmin ping -h localhost --password=${MYSQL_ROOT_PASSWORD}
      interval: 5s
      retries: 20
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed

      # InnoDB memory and storage
      - --innodb-buffer-pool-size=2G
      - --innodb-log-file-size=256M
      - --innodb-file-per-table=1
      - --innodb-flush-log-at-trx-commit=1

      # Connection management
      - --max-connections=150
      - --thread-cache-size=50
      - --table-open-cache=2000

      # Temporary tables
      - --tmp-table-size=32M
      - --max-heap-table-size=32M

      # Disable query cache
      - --query-cache-type=0
      - --query-cache-size=0

      # Diagnose slow queries
      - --slow-query-log=1
      - --long-query-time=1
      - --log-queries-not-using-indexes=0
      - --slow-query-log-file=/var/lib/mysql/slow-queries.log
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: always
    depends_on:
      - websocket
    networks:
      - frappe_network
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: ${BACKEND}
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER}
      SOCKETIO: websocket:${SOCKETIO_PORT}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "8080:8080"

  queue-short-1:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: always
    networks:
      - frappe_network
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}

  queue-short-2:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: always
    networks:
      - frappe_network
    command: ["bench", "worker", "--queue", "short,default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}

  queue-default:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: always
    networks:
      - frappe_network
    command: ["bench", "worker", "--queue", "default"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}

  queue-long:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: always
    networks:
      - frappe_network
    command: ["bench", "worker", "--queue", "long"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}

  redis-queue:
    image: redis:6.2-alpine
    restart: always
    networks:
      - frappe_network
    volumes:
      - redis-queue-data:/data
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-cache:
    image: redis:6.2-alpine
    restart: always
    networks:
      - frappe_network
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  redis-socketio:
    deploy:
      restart_policy:
        condition: always
    image: redis:6.2-alpine
    volumes:
      - redis-socketio-data:/data
    networks:
      - frappe_network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 3


  scheduler:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    restart: always
    networks:
      - frappe_network
    command: ["bench", "schedule"]
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs


  websocket:
    image: ghcr.io/tech-vision-plc/techvision-lms-docker:latest
    healthcheck:
      test:
        - CMD
        - wait-for-it
        - '0.0.0.0:9000'
      interval: 2s
      timeout: 10s
      retries: 30
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    depends_on:
      configurator:
        condition: service_completed_successfully
        required: true
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - bench-network

volumes:
  db-data:
  redis-queue-data:
  redis-socketio-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge